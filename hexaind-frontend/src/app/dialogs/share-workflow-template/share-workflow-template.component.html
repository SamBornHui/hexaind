<div fxLayout="column" class="h-100">
  <div
    fxFlex="none"
    fxLayout="row"
    fxLayoutAlign="space-between center"
    class="p-6 border-bottom"
  >
    <div>
      <h1>Share workflow template</h1>
    </div>
    <div>
      <button mat-icon-button (click)="onClosePanel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
  <div fxFlex="none" fxLayout="column" fxLayoutGap="16px" class="p-6">
    <div>
      <div
        fxLayout="row"
        fxLayoutGap="4px"
        fxLayoutAlign="start center"
        class="mb-1"
      >
        <div class="fw-bold">Choose Project</div>        
      </div>
      <mat-form-field appearance="outline">
        <mat-select [(ngModel)]="selectedProject">
          <mat-option *ngFor="let project of projects"[value]="project._id">{{project.project_name}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <div
    fxFlex="none"
    fxLayout="row"
    fxLayoutAlign="space-between center"
    class="p-6 pt-0"
  >
    <div>
      <ng-container *ngIf="isSharingWorkflowTemplate">
        <mat-spinner diameter="24"></mat-spinner>
      </ng-container>
    </div>
    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="16px">
      <button
        mat-stroked-button
        color="primary"
        id="closeButton"
        (click)="onClosePanel()"
      >
        Cancel
      </button>
      <button
        mat-flat-button
        color="primary"
        id="createButton"
        [disabled]="selectedProject ==''"
        (click)="onShareWorkflowTemplate()"
      >
        Create
      </button>

      
    </div>
  </div>
</div>
