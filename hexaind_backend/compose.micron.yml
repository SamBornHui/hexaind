services:
  micron_setup:
    image: databrick/hexaind_backend:${BACKEND_VERSION:-develop}
    build: &micron-build
      context: .
      dockerfile: Dockerfile
      target: prod
    command: ["hexaind", "init", "micron"]
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 512M
    user: 14950:14258
    env_file: &micron-env-files
      - monitoring.env
      - thermocalc.env
      - jupyterhub.env
      - celery.env
      - azure.env
      - backend.env
    volumes:
      - hexaind-data:${HEXAIND_DATA}
      - hexaind-logs:${HEXAIND_HOME}/logs
      - hexaind-drive:${HEXAIND_DRIVE}
      - share:${TDAM_SHARED_PATH}
    profiles:
      - micron
      - backend
      - all
  micron_apis_proxy:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx
        COPY ./contrib/micron_nginx.conf /etc/nginx/conf.d/default.conf
    depends_on:
      micron_apis:
        condition: service_started
        restart: true
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/nginx_health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 5s
    ports:
      - 8071:80
    restart: always
    profiles:
      - micron
      - backend
      - all
  micron_apis:
    image: databrick/hexaind_backend:${BACKEND_VERSION:-develop}
    build: *micron-build
    command: ["hexaind", "api", "micron"]
    deploy:
      mode: replicated
      replicas: 2
      # resources:
      #   limits:
      #     cpus: '4.0'
      #     memory: 16G
      #   reservations:
      #     cpus: '1.0'
      #     memory: 2G
    depends_on:
      micron_setup:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    user: 14950:14258
    volumes:
      - hexaind-data:${HEXAIND_DATA}
      - hexaind-logs:${HEXAIND_HOME}/logs
      - hexaind-drive:${HEXAIND_DRIVE}
      - share:${TDAM_SHARED_PATH}
    env_file: *micron-env-files
    restart: always
    profiles:
      - micron
      - backend
      - all
  micron_action_worker:
    image: databrick/hexaind_backend:${BACKEND_VERSION:-develop}
    build: *micron-build
    command: ["hexaind", "worker", "micron"]
    deploy:
      mode: replicated
      replicas: 2
      # resources:
      #   limits:
      #     cpus: '4.0'
      #     memory: 16G
      #   reservations:
      #     cpus: '1.0'
      #     memory: 2G
    depends_on:
      micron_setup:
        condition: service_completed_successfully
        restart: true
    user: 14950:14258
    volumes:
      - hexaind-data:${HEXAIND_DATA}
      - hexaind-logs:${HEXAIND_HOME}/logs
      - hexaind-drive:${HEXAIND_DRIVE}
      - share:${TDAM_SHARED_PATH}
      - ${EXTERNAL_GOOGLE_CREDS_PATH}:${GOOGLE_APPLICATION_CREDENTIALS}
    env_file: *micron-env-files
    environment:
      CELERY_WORKER_AUTOSCALE: 20,30
    restart: always
    profiles:
      - micron
      - backend
      - all
volumes:
  share:
    driver: local
    driver_opts:
      type: nfs
      o: addr=azwucfs3-data1,nolock,soft,rw
      device: :/tdam-spock-share
