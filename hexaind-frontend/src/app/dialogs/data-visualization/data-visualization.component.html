<div fxLayout="column" class="h-100">
  <div fxFlex="none" fxLayout="row" fxLayoutAlign="space-between center" class="border-bottom p-6">
    <div>
      <h1>Data Visualization</h1>
    </div>
    <div fxLayout="row" fxLayoutAlign="end center" fxFlex="none">
      <span class="material-symbols-outlined" style="margin-right: 8px; cursor: pointer;"
        matTooltip="{{ isExpanded ? 'Collapse All' : 'Expand All' }}" matTooltipPosition="above"
        (click)="toggleAllPanels()">
        {{ isExpanded ? 'expand_less' : 'expand_more' }}
      </span>

      <button mat-icon-button [mat-dialog-close]="true">
        <mat-icon class="close-icon">close</mat-icon>
      </button>
    </div>
  </div>
  <div fxFlex class="y-auto">
    <ng-container *ngIf="data.plots.length > 0">
      <ng-container *ngIf="data.string_value">
        <div fxLayout="row" style="width: 100%; height: 100%;" *ngFor="let plot of data.plots; let i = index">
          <div *ngIf="isLoading[i]" fxLayout="column" fxLayoutAlign="center center" class="floating-preloader">
            <mat-spinner diameter="24"></mat-spinner>
          </div>
          <object type="text/html" [data]="plot" class="interactive-graph" style="width: 100%;"
            (load)="onPlotLoad(i)"></object>
        </div>
      </ng-container>
      <ng-container *ngIf="!data.string_value">
        <div *ngIf="loader" fxLayout="column" fxLayoutAlign="center center" class="floating-preloader">
          <mat-spinner diameter="24"></mat-spinner>
        </div>
        <mat-accordion class="global-accordion" [multi]="true" *ngIf="!loader">
          <mat-expansion-panel *ngFor="let folder of groupedFiles">
            <mat-expansion-panel-header>
              <mat-panel-title>{{ folder.folder_name }}</mat-panel-title>
              <mat-panel-description>{{ folder.images.length }} Images</mat-panel-description>
            </mat-expansion-panel-header>
        
            <mat-accordion [multi]="true">
              <mat-expansion-panel *ngFor="let image of folder.images">
                <mat-expansion-panel-header>
                  <mat-panel-title>{{ image.name }}</mat-panel-title>
                </mat-expansion-panel-header>
                <div class="global-image-container" style="height: 700px;">
                  <img [src]="image.imageUrl" alt="{{ image.name }}" class="global-image-fit">
                </div>
              </mat-expansion-panel>
            </mat-accordion>
          </mat-expansion-panel>
        </mat-accordion>
               
      </ng-container>
    </ng-container>
  </div>
</div>
