<div fxLayout="column" class="h-100">
  <div fxFlex="none" fxLayout="row" fxLayoutAlign="space-between center" class="p-6 border-bottom">
    <div>
      <h1>Update Connectors</h1>
    </div>
    <div>
      <button mat-icon-button [mat-dialog-close]="true">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
  <div fxFlex="none" fxLayout="column" fxLayoutGap="16px" class="p-6">
    <div>
      <div fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="start center" class="mb-1">
        <div class="fw-bold">Name</div>
        <div>
          <mat-icon class="material-symbols-outlined global-info-icon"
            matTooltip="The name of the connector.">info</mat-icon>
        </div>
      </div>
      <mat-form-field appearance="outline">
        <input matInput required id="name" name="connectorName" [(ngModel)]="connectorName"
          (ngModelChange)="handleInputChange($event)" #newProjectNameModel="ngModel" placeholder="Enter name" />
        <mat-error *ngIf="nameError">{{ nameError }}</mat-error>
      </mat-form-field>
    </div>
    <div>
      <div fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="start center" class="mb-1">
        <div class="fw-bold">Description</div>
        <div>
          <mat-icon class="material-symbols-outlined global-info-icon"
            matTooltip="The description of the connector.">info</mat-icon>
        </div>
      </div>
      <mat-form-field appearance="outline">
        <textarea matInput required id="description" [(ngModel)]="connectorDescription"
          (ngModelChange)="handleInputChange($event)" placeholder="Enter description"></textarea>
        <mat-error *ngIf="descriptionError">{{ descriptionError }}</mat-error>
      </mat-form-field>
    </div>
    <ng-container *ngIf="this.data.connectors.type === 'THERMOCALC'">
      <div>
        <div class="fw-bold pb-1">Select Authentication method</div>
        <mat-radio-group [(ngModel)]="this.data.connectors.configuration.method">
          <mat-radio-button color="primary" value="server_ip_address">Server IP Address</mat-radio-button>
        </mat-radio-group>
      </div>
      <div>
        <div fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="start center" class="mb-1">
          <div class="fw-bold">Server name</div>
          <div>
            <mat-icon class="material-symbols-outlined global-info-icon"
              matTooltip="The host of the connector.">info</mat-icon>
          </div>
        </div>
        <mat-form-field appearance="outline">
          <input matInput [(ngModel)]="this.data.connectors.configuration.host"
            (ngModelChange)="handleInputChange($event)" placeholder="Enter host">
        </mat-form-field>
      </div>
      <div>
        <div fxLayout="row" fxLayoutGap="4px" fxLayoutAlign="start center" class="mb-1">
          <div class="fw-bold">Application path</div>
          <div>
            <mat-icon class="material-symbols-outlined global-info-icon"
              matTooltip="The path of the connector.">info</mat-icon>
          </div>
        </div>
        <mat-form-field appearance="outline">
          <input matInput [(ngModel)]="this.data.connectors.configuration.path" placeholder="Enter path">
        </mat-form-field>
      </div>
      <div fxFlex="none" fxLayout="row" fxLayoutGap="8px" fxLayoutAlign=" center">
        <button mat-flat-button color="primary" class="upload-btn" (click)="authentication()" [disabled]="!checkValidation()">
          Authenticate
        </button>
        <mat-spinner matSuffix *ngIf="spinner" diameter="24"></mat-spinner>
        <div *ngIf="spinner" class="text-gray">Checking authentication...</div>

     <mat-icon matPrefix *ngIf="isJsonAuthenticationSuccessful" class="text-green">check</mat-icon>
        <div *ngIf="isJsonAuthenticationSuccessful" class="text-green">Authentication Successful</div>
      
        <mat-icon matPrefix *ngIf="isJsonAuthenticationFailed" class="text-red">cancel</mat-icon>
        <div *ngIf="isJsonAuthenticationFailed" class="text-red">Authentication Failed</div>
      </div>
    </ng-container>
  </div>
  <div fxFlex="none" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="16px" class="p-6 pt-0">
    <button mat-stroked-button color="primary" id="closeButton" mat-dialog-close>
      Cancel
    </button>
    <button mat-flat-button [disabled]="isCreatingConnectors" color="primary" id="createButton"
      (click)="onUpdateProject()">
      Save
    </button>
  </div>
</div>
