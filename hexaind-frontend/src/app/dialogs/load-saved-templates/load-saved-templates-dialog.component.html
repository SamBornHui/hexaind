<div fxLayout="column" class="h-100">
    <div fxFlex="none" fxLayout="row" fxLayoutAlign="space-between center" class="p-6 border-bottom">
        <div>
            <h1>Select Workflow Template</h1>
        </div>
        <div>
            <button mat-icon-button [mat-dialog-close]="true">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
    <div fxFlex class="y-auto">
        <table mat-table [dataSource]="dataSource" matSort *ngIf="!preview">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let element">                        
                    <mat-radio-button color="primary" name="table-radio-button" [value]="element"
                        (click)="$event.stopPropagation()" (change)="onRadioChange(element)">
                        <div fxLayout="row" fxLayoutAlign=" center" fxLayoutGap="8px" style="cursor: pointer;">
                            <div fxFlex>{{ element.name }}</div>
                        </div>
                    </mat-radio-button>                         
                </td>
            </ng-container>
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
                <td mat-cell *matCellDef="let element">{{ element.description }} kb</td>
            </ng-container>

            <ng-container matColumnDef="preview">
                <th mat-header-cell *matHeaderCellDef >Preview</th>
                <td mat-cell *matCellDef="let element">
                    <button matTooltip="Workflow Template Preview"
                      (click)="onPreviewWorkflowTemplate(element)" style="margin-bottom: -5px"
                      mat-icon-button class="expand-button">
                    <mat-icon>preview</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <div fxLayout="row" *ngIf="preview">
            <div fxFlex>
                <img width="100%"[src]="templateImage">
            </div>
        </div>
    </div>
    <div fxFlex="none" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="16px" class="p-6">
        <button mat-stroked-button color="primary" mat-dialog-close *ngIf="!preview">Cancel</button>
        <button mat-flat-button color="primary" (click)="onSubmit()" *ngIf="!preview">Load</button>
        <button mat-flat-button color="primary" (click)="preview = false" *ngIf="preview">Back</button>
    </div>
</div>
