<div
  class="mst-file-upload__dropzone"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  [class.dragover]="isDragging"
>
  <h3>Drag & Drop or Click to Upload</h3>
  <p>Supports multiple {{ fileExts.join(", ") }} files</p>
  <input
    type="file"
    #fileInput
    (change)="onFileSelected($event)"
    [accept]="getAcceptTypes()"
    multiple
    style="display: none"
  />
  <mst-button (click)="fileInput.click()"> Choose Files </mst-button>
</div>
