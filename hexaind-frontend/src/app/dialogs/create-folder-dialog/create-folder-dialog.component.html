<div fxLayout="column" class="h-100">
  <div
    fxFlex="none"
    fxLayout="row"
    fxLayoutAlign="space-between center"
    class="border-bottom p-6"
  >
    <div>
      <h1>Create Folder</h1>
    </div>
    <div>
      <button mat-icon-button (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
  <div fxFlex fxLayout="column" fxLayoutGap="16px" class="p-6">
    <div fxFlex="none">
      <div class="fw-bold mb-1">Name</div>
      <mat-form-field appearance="outline">
        <input
          matInput
          placeholder="Enter name"
          [(ngModel)]="new_folder_name"
          required
        />
        <mat-error>Name required</mat-error>
      </mat-form-field>
    </div>
    <div fxFlex="none">
      <div class="fw-bold mb-1">Choose Destination</div>
      <mat-form-field appearance="outline">
        <input matInput placeholder="Search" (input)="filterNodes($event)" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div fxFlex class="y-auto">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <mat-tree-node
          *matTreeNodeDef="let node"
          matTreeNodePadding
          [class.selected]="isFileSelected(node)"
          (click)="toggleFileSelection(node); $event.stopPropagation()"
        >
          <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
            <div fxFlex="none">
              <button mat-icon-button disabled></button>
            </div>
            <div fxFlex="none">
              <mat-icon class="material-symbols-outlined text-grey">{{
                node.type === "file" ? "insert_drive_file" : "folder"
              }}</mat-icon>
            </div>
            <div fxFlex class="text-ellipse">{{ node.name }}</div>
            <div fxFlex="none" class="check" *ngIf="isFileSelected(node)">
              <mat-icon>check</mat-icon>
            </div>
          </div>
        </mat-tree-node>
        <mat-nested-tree-node
          *matTreeNodeDef="let node; when: hasChild"
          matTreeNodePadding
          [class.selected]="isFileSelected(node) && data.type === 'save'"
          (click)="toggleFileSelection(node); $event.stopPropagation()"
          [class.selected]="isFileSelected(node)"
        >
          <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px" *ngIf="isCreatingFolderInThisDatasetEnabled(node)">
            <div fxFlex="none">
              <button
                mat-icon-button
                matTreeNodeToggle
                [attr.aria-label]="'toggle ' + node.name"
              >
                <mat-icon class="mat-icon-rtl-mirror">
                  {{
                    treeControl.isExpanded(node)
                      ? "arrow_drop_down"
                      : "arrow_right"
                  }}
                </mat-icon>
              </button>
            </div>
            <div fxFlex="none">
              <mat-icon class="material-symbols-outlined text-grey">{{
                node.type === "file" ? "insert_drive_file" : "folder"
              }}</mat-icon>
            </div>
            <div fxFlex class="text-ellipse">{{ node.name }}</div>
            <div fxFlex="none" class="check" *ngIf="isFileSelected(node)">
              <mat-icon>check</mat-icon>
            </div>
          </div>
          <ul
            [class.example-tree-invisible]="!treeControl.isExpanded(node)"
            class="my-0"
            *ngIf="isCreatingFolderInThisDatasetEnabled(node)"
          >
            <ng-container matTreeNodeOutlet></ng-container>
          </ul>
        </mat-nested-tree-node>
      </mat-tree>
    </div>
  </div>
  <div
    fxFlex="none"
    fxLayout="row"
    fxLayoutGap="16px"
    fxLayoutAlign="end center"
    class="p-6 pt-0"
  >
    <button mat-stroked-button color="primary" (click)="close()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="disableCreate()"
      (click)="createFolder()"
    >
      Create
    </button>
  </div>
</div>
