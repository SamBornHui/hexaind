<div class="dialog-overlay h-100 p-8">
  <div class="dialog">
    <div fxLayout="column">
      <div
        fxFlex="none"
        fxLayout="row"
        fxLayoutAlign="space-between center"
        class="border-bottom"
      >
        <div>
          <h1>Workflow Run Summary</h1>
        </div>
        <div>
          <button mat-icon-button (click)="onClosePanel()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <div class="pt-7" fxLayout="column" fxLayoutGap="16px">
      <div>
        <div class="fw-bold mb-1">
          Workflow Run Status: {{ GetWorkflowStatus() }}
        </div>
      </div>
    </div>
    <div class="pt-7" fxLayout="column" fxLayoutGap="16px">
      <div class="scrollable-table-container">
        <table mat-table [dataSource]="widgetStatuses">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">{{ element.status }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
    <div class="pt-7" fxLayout="column" fxLayoutGap="16px">&nbsp;</div>
    <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px">
    
      <button mat-stroked-button color="primary" (click)="onViewDataset()">
        View Workflow Dataset Results
      </button>
     
    </div>
  </div>
</div>
